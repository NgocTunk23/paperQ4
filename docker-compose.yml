version: '3.8'

services:
  traffic-simulator:
    build: .
    image: hcmc-traffic-bot:latest
    container_name: traffic-bot-1
    # Đổi thành "no" để container không tự động chạy lại sau khi hoàn tất pipeline
    restart: "no" 
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
      - ./outputs:/app/outputs
    command: python run_pipeline.py

  web-frontend:
    image: python:3.11-slim
    container_name: cityflow_frontend
    # Giữ nguyên để Web Server luôn duy trì hoạt động
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ./:/app
    working_dir: /app
    command: python -m http.server 8000