version: '3.8'

services:
  traffic-simulator:
    build: .
    image: hcmc-traffic-bot:latest
    container_name: traffic-bot-1
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
      # Map tường minh thư mục outputs để lưu các file ma trận sinh ra
      - ./outputs:/app/outputs 
    # Cập nhật command để chạy luồng quy trình tạo ma trận GNN
    command: python run_pipeline.py

  web-frontend:
    image: python:3.11-slim
    container_name: cityflow_frontend
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ./:/app
    working_dir: /app
    command: python -m http.server 8000